name: Website checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-content.mjs
      - run: node scripts/check-indexing.mjs
      - run: node scripts/check-security.mjs
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SITE_INDEXABLE: 'false'
      - run: node scripts/check-production.mjs
        env:
          SITE_INDEXABLE: 'false'
